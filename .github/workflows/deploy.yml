name: Deploy MoZ to one.com

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # one.com's FTPS server sends a TLS "internal error" alert to the Node-based
      # FTP-Deploy-Action (basic-ftp), so we use lftp instead, which is known to
      # work reliably against one.com.
      - name: Deploy via lftp (FTPS)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set net:max-retries 2
          set net:timeout 30
          set mirror:parallel-transfer-count 1
          mirror --reverse --verbose --only-newer \
            --exclude-glob .git* \
            --exclude-glob .github/ \
            --exclude-glob _notes/ \
            --exclude-glob tests/ \
            --exclude-glob .gitkeep \
            --exclude-glob phpunit/ \
            --exclude-glob kint-php/ \
            ./ "$FTP_SERVER_DIR"
          bye
          EOF
