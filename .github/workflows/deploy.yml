name: Deploy MoZ to one.com

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via rsync over SFTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          SSH_USERNAME: ${{ secrets.FTP_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.ID_ED25519 }}
          SFTP_SERVER_DIR: /customers/e/5/3/cfb5wd2sc/webroots/fad1c1e4
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq rsync
          SSH_HOST="${FTP_SERVER#*://}"
          SSH_HOST="${SSH_HOST%%/*}"
          SSH_HOST="${SSH_HOST%%:*}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          rsync -rlptDz --update --verbose \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_notes/' \
            --exclude='tests/' \
            --exclude='.gitkeep' \
            --exclude='vendor/phpunit/' \
            --exclude='vendor/kint-php/' \
            -e 'ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes' \
            ./ "${SSH_USERNAME}@${SSH_HOST}:${SFTP_SERVER_DIR%/}/"
